[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellarai"
version = "0.1.0"
description = "StellarAI - 模块化、可编排、接口驱动的端到端 AI 系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["ai", "llm", "rag", "agent", "modular", "orchestration"]
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "numpy>=2.0,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "typer>=0.12,<1",
    "rich>=13,<16",
    "pyyaml>=6.0,<7",
    "pypdf>=4,<7",
]

[project.optional-dependencies]
llm-vllm = ["vllm>=0.29,<0.30; sys_platform != 'win32'"]
llm-llamacpp = ["llama-cpp-python>=0.3,<0.4"]
embeddings = ["sentence-transformers>=3,<7"]
vector = ["chromadb>=0.5,<2"]
agent = ["langgraph>=0.1,<2"]
all = [
    "vllm>=0.29,<0.30; sys_platform != 'win32'",
    "llama-cpp-python>=0.3,<0.4",
    "sentence-transformers>=3,<7",
    "chromadb>=0.5,<2",
    "langgraph>=0.1,<2",
]

[project.scripts]
stellarai = "stellarai.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "mypy>=1.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stellarai"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
