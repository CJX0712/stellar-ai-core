name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv

      - name: Set up Python
        run: uv python install 3.13

      - name: Lock and sync dependencies
        run: |
          uv lock
          uv sync

      - name: Lint
        run: uv run ruff check src tests || true

      - name: Test
        run: uv run pytest -q
